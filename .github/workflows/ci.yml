name: CI — Lint, Tests, Type Check, Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint → Registry → Tests → Type Check → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint all source files
        run: npm run lint:ci

      - name: Build registry
        run: npm run registry:build

      - name: Test components and registry installations
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check CLI
        run: npx tsc -p cli/tsconfig.json --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Verify registry output
        run: |
          echo "Registry files:"
          ls -la public/r/*.json | wc -l
          echo "Generated component files and index.json"
          test -f public/r/index.json || (echo "Missing index.json" && exit 1)

  figma:
    name: Figma plugin types and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: figma-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: figma-plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test


  api:
    name: API security and provider tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m pip_audit -r requirements.txt

  browser:
    name: Browser isolation, interactions, and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - run: npm run test:visual
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
