[pytest]
# Pytest configuration for AI Studio API tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    endpoint: marks tests as endpoint tests
    model: marks tests as model validation tests
    util: marks tests as utility function tests
    rate_limit: marks tests as rate limit tests

# Asyncio mode
asyncio_mode = auto

# Test output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
